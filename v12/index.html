<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f4"><meta name="version" content="v12-web 1.0.0"><meta name="description" content="RhythmicVisual v12 — an interactive study of rhythm, curves and dispersed light."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M32 4C64 4 64 32 32 32S0 60 32 60%27 fill=%27none%27 stroke=%27%23778899%27 stroke-width=%274%27/%3E%3C/svg%3E"><title>RhythmicVisual — v12</title><link rel="stylesheet" href="./src/style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body class="inverted">
<canvas id="stage" aria-label="리듬 커브와 빛을 표시하는 3D 캔버스"></canvas><canvas id="labels" aria-hidden="true"></canvas>
<button id="ui-toggle" aria-expanded="true">Hide UI</button>
<aside class="panel left" id="controls" aria-label="Curve controls">
<section id="light-panel" class="gui"><h2>Meter light<button class="collapse" aria-label="Collapse Meter light" aria-expanded="true">−</button></h2><div class="gui-body" id="light-controls"></div></section>
<section id="rhythm-panel"><div class="gui"><h2>Meter Rhythm<button class="collapse" aria-label="Collapse Meter Rhythm" aria-expanded="true">−</button></h2><div class="gui-body"><label class="field rhythm-field"><span>rhythm</span><input id="rhythm" type="text" autocomplete="off" spellcheck="false" maxlength="8192" aria-label="rhythm" aria-describedby="input-help"></label><div id="position-controls"></div></div></div>
<p id="input-help" class="sr-only">Blank uses the meter’s default rhythm.</p><div id="meter-info"></div>
<div class="actions"><button id="apply">Apply next loop (Enter)</button><button id="camera-reset">Camera: Default view (R)</button><button id="clear-history">Hide depth history</button><button id="clear-all">Restart my rhythm</button><button id="all-clear" title="모든 화면의 공유 갤러리를 비웁니다 (보관 기록은 유지)">All clear</button><button id="orthographic-export">Orthographic export</button><button id="perspective-export">Perspectively export</button><button id="history-toggle" aria-pressed="true">History: <span>VISIBLE (hide)</span></button><button id="random-toggle" aria-pressed="false">Curve colors: <span>WHITE</span></button></div>
<p id="active-status"></p><p id="input-status" role="status" aria-live="polite"></p><p id="diagnostics"></p></section></aside>
<aside class="panel right" aria-label="Playback and view controls">
<div class="audio-row"><label class="volume-control"><span>volume</span><input id="volume" type="range" min="0" max="1" value="1" step="0.01" aria-label="Jing volume"></label><button id="jing" title="징 소리 켜기/끄기" aria-label="징 소리 켜기/끄기" aria-pressed="true"></button></div>
<button id="invert" aria-pressed="true">Invert: <span>ON (#F4F4F4)</span></button>
<div class="meter-control"><label for="meter-dial">meter</label><div id="meter-knob"><svg viewBox="0 0 90 92" aria-hidden="true"><path class="dial-base" d="M27.322 68.678 A25 25 0 1 1 62.678 68.678"/><path id="meter-arc" class="dial-active"/><line id="meter-needle" x1="45" y1="51" x2="45" y2="32"/></svg><input id="meter-dial" type="range" min="0" max="9" step="1" value="6" aria-label="박자 선택 다이얼"></div><strong id="selected-meter">12/3</strong><p id="meter-status">active</p><span id="meter-order">40/4 -&gt; 4/4</span><select id="meter-select" aria-label="Meter"></select><span id="beats" class="sr-only"></span></div>
<button id="camera-mode">Camera: <span>PERSPECTIVE</span></button>
<button id="audio-start">Enable sound</button>
<div class="help"><p>SPACE: rhythm count<br>Left/Right: meter<br>Dial turn: meter<br>Up/Down: invert</p><button id="tap">Tap rhythm (Space)</button><p id="audio-note">Enable sound to start audio.</p></div>
</aside><p id="version-label" aria-label="Version">v12</p><div id="error" role="alert" hidden></div>
<script type="module" src="./src/main.js"></script></body></html>
