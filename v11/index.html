<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f4"><meta name="description" content="RhythmicVisual v11 — an interactive study of rhythm, curves and dispersed light."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M32 4C64 4 64 32 32 32S0 60 32 60%27 fill=%27none%27 stroke=%27%23778899%27 stroke-width=%274%27/%3E%3C/svg%3E"><title>RhythmicVisual — v11</title><link rel="stylesheet" href="./src/style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body class="inverted"><canvas id="stage" aria-label="리듬 커브와 빛을 표시하는 3D 캔버스"></canvas><canvas id="labels" aria-hidden="true"></canvas>
<header><a class="wordmark" href="./" aria-label="RhythmicVisual home">RHYTHMIC<span>VISUAL</span><small>v11 / WEB</small></a><button id="ui-toggle" aria-expanded="true">Controls</button></header>
<aside class="panel left" id="controls" aria-label="Curve controls"><section><h2>Light <span>01</span></h2><div id="light-controls"></div></section><section><h2>Rhythm <span>02</span></h2><label class="field">rhythm<input id="rhythm" type="text" placeholder="Auto · 3 3 3 3" autocomplete="off" spellcheck="false" maxlength="8192" aria-describedby="input-help"></label><p id="input-help" class="muted">Blank uses the meter’s default rhythm.</p><div id="position-controls"></div><div id="meter-info" class="meter-info"></div><button id="apply" class="primary">Apply next loop <kbd>Enter</kbd></button><button id="camera-reset">Camera · Default view <kbd>R</kbd></button><div class="button-pair"><button id="clear-history">Clear depth</button><button id="clear-all">Clear all</button></div><button id="orthographic-export">Orthographic export <span>SVG</span></button><button id="perspective-export">Perspectively export <span>SVG</span></button><button id="history-toggle" aria-pressed="false">History <span>Visible</span></button><button id="random-toggle" aria-pressed="false">Curve colors <span>White</span></button></section><p id="input-status" role="status" aria-live="polite"></p><p id="diagnostics" class="muted"></p></aside>
<aside class="panel right" aria-label="Playback and view controls"><section><h2>Playback <span>v11</span></h2><button id="audio-start" class="primary">Enable sound</button><div class="audio-row"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" value="0.5" step="0.01"><button id="jing" title="징 소리 켜기/끄기" aria-label="징 소리 켜기/끄기" aria-pressed="true">♬</button><button id="rhythm-audio" title="리듬 소리 켜기/끄기" aria-label="리듬 소리 켜기/끄기" aria-pressed="false">♪</button></div><button id="invert" aria-pressed="true">Invert <span>On · F4F4F4</span></button><button id="layout">Layout <span>Shift right</span></button></section><section class="meter-control"><h2>Meter <span id="beats"></span></h2><div class="dial-row"><input id="meter-dial" type="range" min="0" max="9" step="1" value="6" aria-label="박자 선택 다이얼"><strong id="selected-meter">12/3</strong></div><select id="meter-select" aria-label="Meter"></select><p id="meter-status" class="muted">Active · 4.000s</p></section><section><h2>View <span>03</span></h2><label class="field">Spectrum<select id="emission"><option value="0">Directional</option><option value="1">v3 Radial</option><option value="2">Area: One side</option><option value="3" selected>Area: Alternating</option></select></label><button id="light-color">Light <span>Rainbow</span></button><button id="curve-mode">Curve <span>Flat</span></button><button id="camera-mode">Camera <span>Perspective</span></button></section><div class="help"><p>Drag to orbit · Right drag to pan<br>Wheel to zoom · <kbd>R</kbd> reset</p><p><kbd>Space</kbd> record rhythm<br><kbd>←</kbd> <kbd>→</kbd> select meter<br><kbd>↑</kbd> invert on · <kbd>↓</kbd> off</p><button id="tap" class="tap">Tap rhythm <kbd>Space</kbd></button><button id="fullscreen">Fullscreen</button></div></aside>
<div id="audio-note" class="bottom-note">브라우저에서 소리를 사용하려면 Enable sound를 눌러주세요.</div><div id="error" role="alert" hidden></div>
<script type="module" src="./src/main.js"></script></body></html>
